version: 2

updates:
  # Keep the SHA-pinned workflow actions current in small, reviewable updates.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Zagreb"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"

  # Browser test dependencies are isolated from the published static artifact.
  - package-ecosystem: "npm"
    directory: "/tests/browser"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Zagreb"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    commit-message:
      prefix: "test(deps)"
